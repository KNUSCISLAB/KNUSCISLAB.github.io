name: Deploy analytics server

# Deploys analytics/worker.js to Cloudflare Workers and creates the D1 database on first run.
# Needs these repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, ANALYTICS_KEY, ANALYTICS_SALT.
on:
  push:
    branches: [main]
    paths: ['analytics/**', '.github/workflows/analytics.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analytics
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ANALYTICS_KEY: ${{ secrets.ANALYTICS_KEY }}
      ANALYTICS_SALT: ${{ secrets.ANALYTICS_SALT }}
    steps:
      - uses: actions/checkout@v7

      - name: Check secrets
        id: check
        run: |
          missing=""
          for s in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ANALYTICS_KEY ANALYTICS_SALT; do
            [ -z "${!s}" ] && missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Analytics not deployed. Missing secrets:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 24

      - name: Find or create the D1 database
        if: steps.check.outputs.ready == 'true'
        run: |
          npm i -g wrangler@4 >/dev/null
          id=$(wrangler d1 list --json | jq -r '.[] | select(.name=="scislab-analytics") | .uuid')
          if [ -z "$id" ]; then
            wrangler d1 create scislab-analytics
            id=$(wrangler d1 list --json | jq -r '.[] | select(.name=="scislab-analytics") | .uuid')
          fi
          [ -n "$id" ] || { echo "::error::Could not find or create the D1 database"; exit 1; }
          sed -i "s/DATABASE_ID/$id/" wrangler.toml
          wrangler d1 execute scislab-analytics --remote --file=schema.sql

      - name: Deploy worker
        if: steps.check.outputs.ready == 'true'
        run: |
          wrangler deploy | tee deploy.log
          jq -n --arg k "$ANALYTICS_KEY" --arg s "$ANALYTICS_SALT" '{ANALYTICS_KEY:$k, ANALYTICS_SALT:$s}' > secrets.json
          wrangler secret bulk secrets.json
          rm secrets.json
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "Worker URL: $url"
          echo "### Analytics server: $url" >> "$GITHUB_STEP_SUMMARY"
