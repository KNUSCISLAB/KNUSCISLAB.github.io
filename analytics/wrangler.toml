# Cloudflare Worker that collects visit statistics for knuscislab.github.io.
# Deployed by .github/workflows/analytics.yml; database_id is filled in there.
name = "scislab-analytics"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://knuscislab.github.io,http://localhost:8000,http://127.0.0.1:8000"

[[d1_databases]]
binding = "DB"
database_name = "scislab-analytics"
database_id = "DATABASE_ID"
