# Pages CMS configuration (관리 화면 설정)
# 이 파일이 관리 화면의 메뉴와 입력칸을 정합니다. 보통은 고칠 필요가 없습니다.

media:
  input: assets/uploads
  output: /assets/uploads
  rename: safe

settings:
  content:
    merge: true
  commit:
    identity: user

content:
  # ---------------- 뉴스 ----------------
  - name: news
    label: "뉴스 (News)"
    type: collection
    path: data/news
    format: json
    filename: "{year}-{month}-{day}-{primary}.json"
    view:
      fields: [date, title_ko, title_en, category]
      primary: title_en
      sort: [date, title_en]
      search: [title_en, title_ko]
      default:
        sort: date
        order: desc
    fields:
      - name: date
        label: "날짜 (연-월)"
        type: date
        required: true
        options:
          format: yyyy-MM
      - name: category
        label: "종류"
        type: select
        required: true
        options:
          values:
            - { name: publication, label: "논문 (Publication)" }
            - { name: award, label: "수상·특허 (Award / Patent)" }
            - { name: talk, label: "발표·강연 (Talk)" }
            - { name: project, label: "과제·협력 (Project)" }
            - { name: recruiting, label: "모집 (Recruiting)" }
            - { name: event, label: "연구실 소식 (Lab event)" }
      - { name: title_en, label: "제목 (영문)", type: string, required: true }
      - { name: title_ko, label: "제목 (한글, 비우면 영문 표시)", type: string }
      - { name: body_en, label: "내용 (영문)", type: text }
      - { name: body_ko, label: "내용 (한글)", type: text }
      - { name: link, label: "관련 링크 (선택)", type: string, description: "https:// 로 시작하는 주소" }
      - { name: image, label: "사진 (선택)", type: image }
      - { name: pinned, label: "홈 화면 맨 앞에 고정", type: boolean, default: false }

  # ---------------- 논문 ----------------
  # 새 논문은 "논문 (Publications)" 메뉴에서 [새로 만들기]로 올립니다.
  # 번호([J1], [E1], [K1], [C1], [D1])는 분류별로 최신 논문부터 자동으로 매겨집니다.
  - name: publications
    label: "논문 (Publications)"
    type: collection
    path: data/publications
    format: json
    filename: "{fields.year}-{primary}.json"
    view:
      fields: [year, title, type, venue]
      primary: title
      sort: [year, title]
      search: [title, authors, venue]
      default:
        sort: year
        order: desc
    fields:
      - name: type
        label: "구분"
        type: select
        required: true
        default: scie
        options:
          values:
            - { name: under_review, label: "심사 중·투고 (Under review / Submitted)" }
            - { name: scie, label: "SCIE 국제학술지" }
            - { name: esci, label: "ESCI(SCOPUS) 국제학술지" }
            - { name: kci, label: "KCI 등재 국내학술지" }
            - { name: other, label: "기타 학술지 (비등재)" }
            - { name: intl_conf, label: "국제학술대회" }
            - { name: domestic_conf, label: "국내학술대회" }
      - { name: year, label: "연도", type: number, required: true }
      - { name: date, label: "게재 연-월 (선택, 예: 2025-10)", type: string }
      - { name: order, label: "정렬 순서 (선택)", type: number, description: "같은 해 안에서 작은 숫자가 위에 옵니다. 비워 두면 그 해의 맨 위(최신)에 놓이고 번호는 자동으로 다시 매겨집니다." }
      - { name: title, label: "논문 제목 (영문)", type: string, required: true }
      - { name: title_ko, label: "논문 제목 (한글, 한글 논문일 때만)", type: string }
      - name: authors
        label: "저자 (논문에 나온 순서대로)"
        type: string
        required: true
        description: "예: Kim, B., Suh, D.*  (교신저자에 * 표시)"
      - name: author_role
        label: "서동준 교수 역할"
        type: select
        default: corresponding
        options:
          values:
            - { name: corresponding, label: "교신저자" }
            - { name: co_corresponding, label: "공동 교신저자" }
            - { name: first_corresponding, label: "제1저자·교신저자" }
            - { name: first, label: "제1저자" }
            - { name: coauthor, label: "공동저자" }
      - { name: venue, label: "학술지·학술대회 이름", type: string, required: true }
      - { name: details, label: "권(호), 페이지 (선택)", type: string, description: "예: 345, 115944  또는  17(9), 1397" }
      - { name: doi, label: "DOI (선택)", type: string, description: "예: 10.1016/j.enbuild.2025.115944  (https://doi.org/ 는 빼고)" }
      - { name: link, label: "논문 링크 (DOI가 없을 때)", type: string }
      - { name: published, label: "게재 정보 (선택)", type: string, description: "예: 2026.01 (online 2025.09)" }
      - { name: status, label: "상태 (선택)", type: string, description: "예: In press, Accepted" }
      - { name: jcr_year, label: "JCR 연도", type: string, description: "예: 2025" }
      - { name: impact_factor, label: "Impact Factor", type: number }
      - name: quartile
        label: "JCR 분위"
        type: select
        options:
          values: ["", Q1, Q2, Q3, Q4]
      - { name: jcr_top, label: "JCR 상위 % (숫자만)", type: number, description: "예: 6.2" }
      - { name: jcr_category, label: "JCR 분야", type: string, description: "예: Automation & Control Systems" }
      - { name: jcr_rank, label: "분야 내 순위", type: string, description: "예: 6/88" }
      - { name: note, label: "메모 (예: Oral, Scopus)", type: string }
      - name: pillar
        label: "연구 분야"
        type: select
        default: energy
        options:
          values:
            - { name: energy, label: "Energy AI" }
            - { name: industrial, label: "Industrial AI" }
            - { name: climate, label: "기후변화 정책 (Climate Change Policy)" }
            - { name: risk, label: "위험 관리 (Risk Management)" }
            - { name: other, label: "기타 (Other)" }
      - { name: featured, label: "홈 화면 대표 논문으로 표시", type: boolean, default: false }
      - { name: thumbnail, label: "대표 그림 (선택)", type: image }
      - { name: pdf, label: "PDF 파일 (선택)", type: file, options: { extensions: [pdf] } }
      - { name: code, label: "코드 링크 (GitHub 등)", type: string }

  # ---------------- 구성원 ----------------
  - name: people
    label: "구성원 (People)"
    type: collection
    path: data/people
    format: json
    filename: "{primary}.json"
    view:
      fields: [name_en, name_ko, role]
      primary: name_en
      sort: [role, name_en]
      search: [name_en, name_ko]
    fields:
      - { name: name_en, label: "이름 (영문)", type: string, required: true }
      - { name: name_ko, label: "이름 (한글, 선택)", type: string }
      - name: role
        label: "구분"
        type: select
        required: true
        options:
          values:
            - { name: postdoc, label: "박사후연구원 (Postdoc)" }
            - { name: researcher, label: "연구원 (Researcher)" }
            - { name: phd, label: "박사과정 (PhD)" }
            - { name: ms, label: "석사과정 (MS)" }
            - { name: intern, label: "학부 인턴 (Intern)" }
            - { name: alumni, label: "졸업생 (Alumni)" }
      - { name: note, label: "비고 (예: MS 2024, 현재 소속)", type: string }
      - { name: email, label: "이메일", type: string }
      - { name: photo, label: "사진 (정사각형 권장)", type: image }
      - { name: interests_en, label: "연구 관심사 (영문)", type: string }
      - { name: interests_ko, label: "연구 관심사 (한글)", type: string }
      - { name: homepage, label: "개인 페이지·LinkedIn (선택)", type: string }
      - { name: order, label: "표시 순서 (작을수록 앞)", type: number, default: 50 }

  # ---------------- 교수 ----------------
  - name: professor
    label: "교수 소개 (Professor)"
    type: file
    path: data/professor.json
    format: json
    operations: { delete: false }
    fields:
      - { name: name_en, label: "이름 (영문)", type: string }
      - { name: name_ko, label: "이름 (한글)", type: string }
      - { name: title_en, label: "직위 (영문)", type: string }
      - { name: title_ko, label: "직위 (한글)", type: string }
      - { name: departments_en, label: "소속 학과 (영문)", type: string, list: true }
      - { name: departments_ko, label: "소속 학과 (한글)", type: string, list: true }
      - { name: email, label: "이메일", type: string }
      - { name: phone, label: "전화", type: string }
      - { name: office_en, label: "연구실 위치 (영문, 여러 줄 가능)", type: text }
      - { name: office_ko, label: "연구실 위치 (한글, 여러 줄 가능)", type: text }
      - { name: photo, label: "사진", type: image }
      - { name: scholar_url, label: "Google Scholar 주소", type: string }
      - { name: orcid_url, label: "ORCID 주소", type: string }
      - { name: cv, label: "CV 파일 (PDF)", type: file, options: { extensions: [pdf] } }
      - { name: bio_en, label: "소개 (영문, 문단은 빈 줄로 구분)", type: text }
      - { name: bio_ko, label: "소개 (한글)", type: text }
      - name: awards
        label: "수상"
        type: object
        list: true
        fields:
          - { name: date, label: "날짜 (예: 2026-03)", type: string }
          - { name: title_en, label: "수상 (영문)", type: string }
          - { name: title_ko, label: "수상 (한글)", type: string }
      - { name: activities, label: "학회·위원 활동 (영문)", type: string, list: true }
      - { name: activities_ko, label: "학회·위원 활동 (한글)", type: string, list: true }

  - name: talks
    label: "초청 강연 (Talks)"
    type: file
    path: data/talks.json
    format: json
    list: true
    fields:
      - { name: date, label: "날짜 (예: 2025-05)", type: string, required: true }
      - { name: title, label: "강연 제목", type: string, required: true }
      - { name: venue, label: "장소·기관", type: string }

  - name: press
    label: "언론 보도 (Press)"
    type: file
    path: data/press.json
    format: json
    list: true
    fields:
      - { name: date, label: "날짜 (예: 2022 또는 2022-05)", type: string, required: true }
      - { name: source, label: "언론사", type: string }
      - { name: title, label: "기사 제목", type: string, required: true }
      - { name: url, label: "기사 주소", type: string }

  # ---------------- 특허 ----------------
  - name: patents
    label: "특허·프로그램 (Patents)"
    type: collection
    path: data/patents
    format: json
    filename: "{fields.kind}-{primary}.json"
    view:
      fields: [date, title_ko, kind]
      primary: title_en
      default: { sort: date, order: desc }
    fields:
      - name: kind
        label: "구분"
        type: select
        required: true
        options:
          values:
            - { name: patent_kr, label: "국내 등록특허" }
            - { name: patent_us, label: "미국 등록특허" }
            - { name: pending, label: "출원 중 (국내·미국·PCT)" }
            - { name: program, label: "프로그램 등록 (한국저작권위원회)" }
      - { name: order, label: "정렬 순서 (선택)", type: number, description: "작은 숫자가 위에 옵니다. 비워 두면 맨 위(최신)에 놓입니다." }
      - name: country
        label: "국가"
        type: select
        default: KR
        options:
          values: [KR, US, PCT]
      - { name: title_en, label: "명칭 (영문)", type: string, required: true }
      - { name: title_ko, label: "명칭 (한글)", type: string }
      - { name: number, label: "등록번호", type: string, description: "예: 10-2954774, US 12,372,931 B2, C-2025-026416" }
      - { name: date, label: "등록일 (예: 2026-04-15)", type: string }
      - { name: application, label: "출원번호", type: string }
      - { name: application_date, label: "출원일 (예: 2023-01-12)", type: string }
      - { name: publication, label: "공개번호 (선택)", type: string }
      - { name: status_en, label: "진행 상태 (영문, 출원 중일 때)", type: string, description: "예: Under examination" }
      - { name: status_ko, label: "진행 상태 (한글)", type: string, description: "예: 심사 중" }
      - { name: inventors_en, label: "발명자 (영문)", type: string }
      - { name: inventors_ko, label: "발명자 (한글)", type: string }

  # ---------------- 연구 ----------------
  - name: research
    label: "연구 주제 (Research)"
    type: collection
    path: data/research
    format: json
    filename: "{fields.pillar}-{primary}.json"
    view:
      fields: [pillar, order, title_en]
      primary: title_en
      default: { sort: order, order: asc }
    fields:
      - name: pillar
        label: "분야"
        type: select
        required: true
        options:
          values:
            - { name: energy, label: "Energy AI (메인)" }
            - { name: industrial, label: "Industrial AI (메인)" }
            - { name: climate, label: "기후변화 정책 (기타 연구)" }
            - { name: risk, label: "위험 관리 (기타 연구)" }
      - { name: order, label: "표시 순서", type: number, default: 10 }
      - { name: title_en, label: "주제 (영문)", type: string, required: true }
      - { name: title_ko, label: "주제 (한글)", type: string }
      - { name: summary_en, label: "설명 (영문)", type: text }
      - { name: summary_ko, label: "설명 (한글)", type: text }
      - { name: keywords, label: "키워드 (쉼표로 구분)", type: string }
      - { name: image, label: "그림 (선택)", type: image }

  - name: projects
    label: "연구과제 (Projects)"
    type: collection
    path: data/projects
    format: json
    filename: "{fields.start}-{primary}.json"
    view:
      fields: [start, end, title_ko]
      primary: title_en
      default: { sort: start, order: desc }
    fields:
      - name: group
        label: "구분"
        type: select
        required: true
        default: pi
        options:
          values:
            - { name: pi, label: "연구책임자 (PI)" }
            - { name: co, label: "공동연구원·참여연구원" }
      - { name: start, label: "시작 (예: 2021-06)", type: string, required: true }
      - { name: end, label: "종료 (예: 2026-05, 비우면 진행 중)", type: string }
      - { name: role_en, label: "역할 (영문)", type: string, description: "예: PI, PI (Director), Co-I (Group Leader)" }
      - { name: role_ko, label: "역할 (한글)", type: string }
      - { name: title_en, label: "과제명 (영문)", type: string, required: true }
      - { name: title_ko, label: "과제명 (한글)", type: string }
      - { name: funder_en, label: "지원 기관·사업 (영문)", type: string }
      - { name: funder_ko, label: "지원 기관·사업 (한글)", type: string }
      - { name: amount_en, label: "연구비 (영문, 선택)", type: string, description: "예: KRW 509 million" }
      - { name: amount_ko, label: "연구비 (한글, 선택)", type: string, description: "예: 5.09억원" }

  - name: programs
    label: "참여 사업·센터 (Programs)"
    type: collection
    path: data/programs
    format: json
    filename: "{fields.start}-{primary}.json"
    view:
      fields: [start, end, name_ko]
      primary: name_en
      default: { sort: start, order: desc }
    fields:
      - { name: start, label: "시작 (예: 2025-07)", type: string, required: true }
      - { name: end, label: "종료 (비우면 현재)", type: string }
      - { name: name_en, label: "이름 (영문)", type: string, required: true }
      - { name: name_ko, label: "이름 (한글)", type: string }
      - { name: role_en, label: "역할 (영문)", type: string }
      - { name: role_ko, label: "역할 (한글)", type: string }

  - name: collaborations
    label: "국제 공동연구 기관 (Collaborations)"
    type: file
    path: data/collaborations.json
    format: json
    list: true
    fields:
      - { name: name, label: "기관명 (영문)", type: string, required: true }
      - { name: country_en, label: "국가 (영문)", type: string, required: true }
      - { name: country_ko, label: "국가 (한글)", type: string }
      - { name: note_en, label: "비고 (영문, 선택)", type: string, description: "예: Visiting scholar (2023–2024)" }
      - { name: note_ko, label: "비고 (한글, 선택)", type: string }

  # ---------------- 기본 설정 ----------------
  - name: site
    label: "홈페이지 기본 설정 (Settings)"
    type: file
    path: data/site.json
    format: json
    operations: { delete: false }
    fields:
      - { name: name_en, label: "연구실 이름 (영문)", type: string }
      - { name: name_ko, label: "연구실 이름 (한글)", type: string }
      - { name: short_name, label: "짧은 이름 (상단 메뉴)", type: string }
      - { name: university_en, label: "대학 (영문)", type: string }
      - { name: university_ko, label: "대학 (한글)", type: string }
      - { name: logo, label: "연구실 로고", type: image }
      - { name: headline_en, label: "첫 화면 큰 제목 (영문)", type: string }
      - { name: headline_ko, label: "첫 화면 큰 제목 (한글)", type: string }
      - { name: intro_en, label: "첫 화면 소개 (영문)", type: text }
      - { name: intro_ko, label: "첫 화면 소개 (한글)", type: text }
      - { name: energy_summary_en, label: "Energy AI 한 줄 소개 (영문)", type: string }
      - { name: energy_summary_ko, label: "Energy AI 한 줄 소개 (한글)", type: string }
      - { name: industrial_summary_en, label: "Industrial AI 한 줄 소개 (영문)", type: string }
      - { name: industrial_summary_ko, label: "Industrial AI 한 줄 소개 (한글)", type: string }
      - { name: recruiting_open, label: "학생 모집 중 표시", type: boolean }
      - { name: recruiting_en, label: "모집 안내 (영문)", type: text }
      - { name: recruiting_ko, label: "모집 안내 (한글)", type: text }
      - { name: email, label: "대표 이메일", type: string }
      - { name: phone, label: "전화", type: string }
      - { name: fax, label: "팩스", type: string }
      - { name: address_en, label: "주소 (영문)", type: text }
      - { name: address_ko, label: "주소 (한글)", type: text }
      - { name: github_url, label: "GitHub 주소", type: string }
      - { name: scholar_url, label: "Google Scholar 주소", type: string }
