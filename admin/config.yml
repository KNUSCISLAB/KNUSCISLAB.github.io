    - name: cv
      label: CV 파일 (PDF)
      widget: file
      required: false
    - name: bio_en
      label: 소개 (영문)
      hint: 문단은 빈 줄로 구분. 짧은 한 줄은 소제목, * 로 시작하는 줄은 목록이 됩니다.
      widget: text
      required: false
    - name: bio_ko
      label: 소개 (한글)
      widget: text
      required: false
    - name: awards
      label: 수상
      widget: list
      fields:
      - name: date
        label: '날짜 (예: 2026-03)'
        widget: string
        required: false
      - name: title_en
        label: 수상 (영문)
        widget: string
        required: false
      - name: title_ko
        label: 수상 (한글)
        widget: string
        required: false
      required: false
    - name: activities
      label: 학회·위원 활동 (영문)
      widget: list
      field:
        name: item
        label: 학회·위원 활동 (영문)
        widget: string
      required: false
    - name: activities_ko
      label: 학회·위원 활동 (한글)
      widget: list
      field:
        name: item
        label: 학회·위원 활동 (한글)
        widget: string
      required: false
- name: talks
  label: 초청 강연 (Talks)
  files:
  - name: talks
    label: 초청 강연 (Talks)
    file: data/talks.json
    format: json
    fields:
    - name: items
      label: 초청 강연 (Talks)
      widget: list
      root: true
      fields:
      - name: date
        label: '날짜 (예: 2025-05)'
        widget: string
      - name: title
        label: 강연 제목
        widget: string
      - name: venue
        label: 장소·기관
        widget: string
        required: false
- name: press
  label: 언론 보도 (Press)
  files:
  - name: press
    label: 언론 보도 (Press)
    file: data/press.json
    format: json
    fields:
    - name: items
      label: 언론 보도 (Press)
      widget: list
      root: true
      fields:
      - name: date
        label: '날짜 (예: 2022 또는 2022-05)'
        widget: string
      - name: source
        label: 언론사
        widget: string
        required: false
      - name: title
        label: 기사 제목
        widget: string
      - name: url
        label: 기사 주소
        widget: string
        required: false
- name: patents
  label: 특허·프로그램 (Patents)
  folder: data/patents
  extension: json
  format: json
  create: true
  slug: "{{fields.kind}}-{{slug}}"
  identifier_field: title_en
  summary: "{{title_en}}"
  fields:
  - name: kind
    label: 구분
    widget: select
    options:
    - label: 국내 등록특허
      value: patent_kr
    - label: 미국 등록특허
      value: patent_us
    - label: 출원 중 (국내·미국·PCT)
      value: pending
    - label: 프로그램 등록 (한국저작권위원회)
      value: program
  - name: order
    label: 정렬 순서 (선택)
    hint: 작은 숫자가 위에 옵니다. 비워 두면 맨 위(최신)에 놓입니다.
    widget: number
    value_type: int
    required: false
  - name: country
    label: 국가
    widget: select
    options:
    - KR
    - US
    - PCT
    default: KR
    required: false
  - name: title_en
    label: 명칭 (영문)
    widget: string
  - name: title_ko
    label: 명칭 (한글)
    widget: string
    required: false
  - name: number
    label: 등록번호
    hint: '예: 10-2954774, US 12,372,931 B2, C-2025-026416'
    widget: string
    required: false
  - name: date
    label: '등록일 (예: 2026-04-15)'
    widget: string
    required: false
  - name: application
    label: 출원번호
    widget: string
    required: false
  - name: application_date
    label: '출원일 (예: 2023-01-12)'
    widget: string
    required: false
  - name: publication
    label: 공개번호 (선택)
    widget: string
    required: false
  - name: status_en
    label: 진행 상태 (영문, 출원 중일 때)
    hint: '예: Under examination'
    widget: string
    required: false
  - name: status_ko
    label: 진행 상태 (한글)
    hint: '예: 심사 중'
    widget: string
    required: false
  - name: inventors_en
    label: 발명자 (영문)
    widget: string
    required: false
  - name: inventors_ko
    label: 발명자 (한글)
    widget: string
    required: false
  sortable_fields:
    fields:
    - date
    - title_ko
    - kind
    default:
      field: date
      direction: descending
- name: research
  label: 연구 주제 (Research)
  folder: data/research
  extension: json
  format: json
  create: true
  slug: "{{fields.pillar}}-{{slug}}"
  identifier_field: title_en
  summary: "{{title_en}}"
  fields:
  - name: pillar
    label: 분야
    widget: select
    options:
    - label: Energy AI (메인)
      value: energy
    - label: Industrial AI (메인)
      value: industrial
    - label: 기후변화 정책 (기타 연구)
      value: climate
    - label: 위험 관리 (기타 연구)
