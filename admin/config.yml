# Sveltia CMS configuration (generated from .pages.yml). Admin UI: https://knuscislab.github.io/admin/
backend:
  name: github
  repo: KNUSCISLAB/KNUSCISLAB.github.io
  branch: main
  auth_methods:
  - token
  commit_messages:
    create: Create {{collection}} “{{slug}}” (via Sveltia CMS)
    update: Update {{collection}} “{{slug}}” (via Sveltia CMS)
    delete: Delete {{collection}} “{{slug}}” (via Sveltia CMS)
    uploadMedia: Upload “{{path}}” (via Sveltia CMS)
    deleteMedia: Delete “{{path}}” (via Sveltia CMS)
site_url: https://knuscislab.github.io
display_url: https://knuscislab.github.io
logo_url: "/assets/img/icon-512.png"
media_folder: assets/uploads
public_folder: "/assets/uploads"
media_libraries:
  default:
    config:
      max_file_size: 30000000
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2000
          height: 2000
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"
collections:
- name: news
  label: 뉴스 (News)
  folder: data/news
  extension: json
  format: json
  create: true
  slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
  identifier_field: title_en
  summary: "{{title_en}}"
  fields:
  - name: date
    label: 날짜 (연-월)
    widget: string
    hint: '예: 2026-07'
  - name: category
    label: 종류
    widget: select
    options:
    - label: 논문 (Publication)
      value: publication
    - label: 수상·특허 (Award / Patent)
      value: award
    - label: 발표·강연 (Talk)
      value: talk
    - label: 과제·협력 (Project)
      value: project
    - label: 모집 (Recruiting)
      value: recruiting
    - label: 연구실 소식 (Lab event)
      value: event
  - name: title_en
    label: 제목 (영문)
    widget: string
  - name: title_ko
    label: 제목 (한글, 비우면 영문 표시)
    widget: string
    required: false
  - name: body_en
    label: 내용 (영문)
    widget: text
    required: false
  - name: body_ko
    label: 내용 (한글)
    widget: text
    required: false
  - name: link
    label: 관련 링크 (선택)
    hint: https:// 로 시작하는 주소
    widget: string
    required: false
  - name: image
    label: 사진 (선택, 여러 장 한꺼번에 선택 가능)
    widget: image
    multiple: true
    max: 20
    required: false
  - name: pinned
    label: 홈 화면 맨 앞에 고정
    widget: boolean
    default: false
    required: false
  sortable_fields:
    fields:
    - date
    - title_ko
    - title_en
    - category
    default:
      field: date
      direction: descending
- name: publications
  label: 논문 (Publications)
  folder: data/publications
  extension: json
  format: json
  create: true
  slug: "{{fields.year}}-{{slug}}"
  identifier_field: title
  summary: "{{title}}"
  fields:
  - name: type
    label: 구분
    widget: select
    options:
    - label: 심사 중·투고 (Under review / Submitted)
      value: under_review
    - label: SCIE 국제학술지
      value: scie
    - label: ESCI(SCOPUS) 국제학술지
      value: esci
    - label: KCI 등재 국내학술지
      value: kci
    - label: 기타 학술지 (비등재)
      value: other
    - label: 국제학술대회
      value: intl_conf
    - label: 국내학술대회
      value: domestic_conf
    default: scie
  - name: year
    label: 연도
    widget: number
    value_type: int
  - name: date
    label: '게재 연-월 (선택, 예: 2025-10)'
    widget: string
    required: false
  - name: order
    label: 정렬 순서 (선택)
    hint: 같은 해 안에서 작은 숫자가 위에 옵니다. 비워 두면 그 해의 맨 위(최신)에 놓이고 번호는 자동으로 다시 매겨집니다.
    widget: number
    value_type: int
    required: false
  - name: title
    label: 논문 제목 (영문)
    widget: string
  - name: title_ko
    label: 논문 제목 (한글, 한글 논문일 때만)
    widget: string
    required: false
  - name: authors
    label: 저자 (논문에 나온 순서대로)
    hint: '예: Kim, B., Suh, D.*  (교신저자에 * 표시)'
    widget: string
  - name: author_role
    label: 서동준 교수 역할
    widget: select
    options:
    - label: 교신저자
      value: corresponding
    - label: 제1저자·교신저자
      value: first_corresponding
    - label: 제1저자
      value: first
    - label: 공동저자
      value: coauthor
    default: corresponding
    required: false
  - name: venue
    label: 학술지·학술대회 이름
    widget: string
  - name: details
    label: 권(호), 페이지 (선택)
    hint: '예: 345, 115944  또는  17(9), 1397'
    widget: string
    required: false
  - name: doi
    label: DOI (선택)
    hint: '예: 10.1016/j.enbuild.2025.115944  (https://doi.org/ 는 빼고)'
    widget: string
    required: false
  - name: link
    label: 논문 링크 (DOI가 없을 때)
    widget: string
    required: false
  - name: published
    label: 게재 정보 (선택)
    hint: '예: 2026.01 (online 2025.09)'
    widget: string
    required: false
  - name: status
    label: 상태 (선택)
    hint: '예: In press, Accepted'
    widget: string
    required: false
  - name: jcr_year
    label: JCR 연도
    hint: '예: 2025'
    widget: string
    required: false
  - name: impact_factor
    label: Impact Factor
    widget: number
    value_type: float
    required: false
  - name: quartile
    label: JCR 분위
    widget: select
    options:
    - Q1
    - Q2
    - Q3
    - Q4
    required: false
  - name: jcr_top
    label: JCR 상위 % (숫자만)
    hint: '예: 6.2'
    widget: number
    value_type: float
    required: false
  - name: jcr_category
    label: JCR 분야
    hint: '예: Automation & Control Systems'
    widget: string
    required: false
  - name: jcr_rank
    label: 분야 내 순위
    hint: '예: 6/88'
    widget: string
    required: false
  - name: note
    label: '메모 (예: Oral, Scopus)'
    widget: string
    required: false
  - name: pillar
    label: 연구 분야
    widget: select
    options:
    - label: Energy AI
      value: energy
    - label: Industrial AI
      value: industrial
    - label: 기후변화 정책 (Climate Change Policy)
      value: climate
    - label: 위험 관리 (Risk Management)
      value: risk
    - label: 기타 (Other)
      value: other
    default: energy
    required: false
  - name: featured
    label: 홈 화면 대표 논문으로 표시
    widget: boolean
    default: false
    required: false
  - name: thumbnail
    label: 대표 그림 (선택)
    widget: image
    required: false
  - name: pdf
    label: PDF 파일 (선택)
    widget: file
    required: false
  - name: code
    label: 코드 링크 (GitHub 등)
    widget: string
    required: false
  sortable_fields:
    fields:
    - year
    - title
    - type
    - venue
    default:
      field: year
      direction: descending
- name: people
  label: 구성원 (People)
  folder: data/people
  extension: json
  format: json
  create: true
  slug: "{{slug}}"
  identifier_field: name_en
  summary: "{{name_en}}"
  fields:
  - name: name_en
    label: 이름 (영문)
    widget: string
  - name: name_ko
    label: 이름 (한글, 선택)
    widget: string
    required: false
  - name: role
    label: 구분
    widget: select
    options:
    - label: 박사후연구원 (Postdoc)
      value: postdoc
    - label: 연구원 (Researcher)
      value: researcher
    - label: 박사과정 (PhD)
      value: phd
    - label: 석사과정 (MS)
      value: ms
    - label: 학석사 통합과정 (BS/MS integrated)
      value: intern
    - label: 졸업생 (Alumni)
      value: alumni
  - name: note
    label: '비고 (예: MS 2024, 현재 소속)'
    widget: string
    required: false
  - name: email
    label: 이메일
    widget: string
    required: false
  - name: photo
    label: 사진 (정사각형 권장)
    widget: image
    required: false
  - name: interests_en
    label: 연구 관심사 (영문)
    widget: string
    required: false
  - name: interests_ko
    label: 연구 관심사 (한글)
    widget: string
    required: false
  - name: homepage
    label: 개인 페이지·LinkedIn (선택)
    widget: string
    required: false
  - name: order
    label: 표시 순서 (작을수록 앞)
    widget: number
    value_type: int
    default: 50
    required: false
