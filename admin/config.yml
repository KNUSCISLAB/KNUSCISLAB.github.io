      widget: string
      required: false
    - name: title_ko
      label: 직위 (한글)
      widget: string
      required: false
    - name: departments_en
      label: 소속 학과 (영문)
      widget: list
      field:
        name: item
        label: 소속 학과 (영문)
        widget: string
      required: false
    - name: departments_ko
      label: 소속 학과 (한글)
      widget: list
      field:
        name: item
        label: 소속 학과 (한글)
        widget: string
      required: false
    - name: email
      label: 이메일
      widget: string
      required: false
    - name: phone
      label: 전화
      widget: string
      required: false
    - name: homepages
      label: 소속별 홈페이지 주소 (위 소속 학과와 같은 순서)
      widget: list
      field:
        name: item
        label: 홈페이지 주소 (여러 개 가능)
        widget: string
      required: false
    - name: office_en
      label: 연구실 위치 (영문, 여러 줄 가능)
      widget: text
      required: false
    - name: office_ko
      label: 연구실 위치 (한글, 여러 줄 가능)
