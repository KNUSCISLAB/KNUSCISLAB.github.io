  - name: summary_en
    label: 설명 (영문)
    widget: text
    required: false
  - name: summary_ko
    label: 설명 (한글)
    widget: text
    required: false
  - name: keywords
    label: 키워드 (쉼표로 구분)
    widget: string
    required: false
  - name: image
    label: 그림 (선택)
    widget: image
    required: false
  sortable_fields:
    fields:
    - order
    - pillar
    - title_en
    default:
      field: order
      direction: ascending
- name: projects
  label: 연구과제 (Projects)
  folder: data/projects
  extension: json
  format: json
  create: true
  slug: "{{fields.start}}-{{slug}}"
  identifier_field: title_en
  summary: "{{title_en}}"
  fields:
  - name: group
    label: 구분
    widget: select
    options:
    - label: 연구책임자 (PI)
      value: pi
    - label: 공동연구원·참여연구원
      value: co
    default: pi
  - name: start
    label: '시작 (예: 2021-06)'
    widget: string
  - name: end
    label: '종료 (예: 2026-05, 비우면 진행 중)'
    widget: string
    required: false
  - name: role_en
    label: 역할 (영문)
    hint: '예: PI, PI (Director), Co-I (Group Leader)'
    widget: string
    required: false
  - name: role_ko
    label: 역할 (한글)
    widget: string
    required: false
  - name: title_en
    label: 과제명 (영문)
    widget: string
  - name: title_ko
    label: 과제명 (한글)
    widget: string
    required: false
  - name: funder_en
    label: 지원 기관·사업 (영문)
    widget: string
    required: false
  - name: funder_ko
    label: 지원 기관·사업 (한글)
    widget: string
    required: false
  - name: amount_en
    label: 연구비 (영문, 선택)
    hint: '예: KRW 509 million'
    widget: string
    required: false
  - name: amount_ko
    label: 연구비 (한글, 선택)
    hint: '예: 5.09억원'
    widget: string
    required: false
  sortable_fields:
    fields:
    - start
    - end
    - title_ko
    default:
      field: start
      direction: descending
- name: programs
  label: 참여 사업·센터 (Programs)
  folder: data/programs
  extension: json
  format: json
  create: true
  slug: "{{fields.start}}-{{slug}}"
  identifier_field: name_en
  summary: "{{name_en}}"
  fields:
  - name: start
    label: '시작 (예: 2025-07)'
    widget: string
  - name: end
    label: 종료 (비우면 현재)
    widget: string
    required: false
  - name: name_en
    label: 이름 (영문)
    widget: string
  - name: name_ko
    label: 이름 (한글)
    widget: string
    required: false
  - name: role_en
    label: 역할 (영문)
    widget: string
    required: false
  - name: role_ko
    label: 역할 (한글)
    widget: string
    required: false
  sortable_fields:
    fields:
    - start
    - end
